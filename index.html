var D=[
["Semana 1 · Fundamentos","Clase_4",[
["calculo","Cálculo e historia","Procedimiento lógico-matemático (algoritmo) para conocer las consecuencias de datos formalizados. Viene del latín calculus = piedra. Sus orígenes están en los griegos y el método de agotamiento.","El área de un círculo es el límite de las áreas de polígonos inscritos: A = lím(n→∞) Aₙ."],
["numeros","Recta numérica y clasificación de números","La recta numérica es un gráfico unidimensional donde los enteros son puntos marcados a distancias iguales. Los conjuntos se anidan: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ.","−3 ∈ ℤ; ½ ∈ ℚ; √2 y π son irracionales; 2 + 3i es complejo."],
["polinomio","Polinomio","Expresión de variables y coeficientes con suma, resta y multiplicación, y exponentes enteros positivos. Según sus términos: monomio, binomio, trinomio.","6x² + 5x + 3 es polinomio; 8x² − 7x⁻³ y √(2x) + x³ no lo son."],

["factorizacion","Factorización","Descomponer una expresión algebraica en producto de factores. Casos: factor común, agrupación, trinomio cuadrado perfecto, diferencia de cuadrados, trinomios, cubos y potencias iguales.","4x³ + 8x⁴ − 32x⁵ = 4x³(1 + 2x − 8x²). 16a² − 49b² = (4a − 7b)(4a + 7b). a² + 2a − 15 = (a + 5)(a − 3). a³ + b³ = (a + b)(a² − ab + b²)."]]],
["Semana 2 · Funciones y gráficas","Clase_5",[
["funcion","Función, dominio y rango","Relación que asigna a cada x del dominio un único f(x). El rango es el conjunto de valores posibles de f(x).","f(x) = √(x + 2): x + 2 ≥ 0, dominio [−2, ∞)."],
["biunivoca","Función biunívoca","f es biunívoca si nunca toma el mismo valor dos veces: x₁ ≠ x₂ ⇒ f(x₁) ≠ f(x₂).","f(x) = x³ sí lo es. f(x) = x² − 1 no, porque f(2) = f(−2)."],
["simetria","Simetría: funciones pares e impares","Par: f(−x) = f(x) (simétrica al eje y). Impar: f(−x) = −f(x) (simétrica al origen).","f(x) = x⁵ + x → f(−x) = −f(x): impar. f(x) = 1 − x⁴: par. f(x) = 2x − x²: ninguna."],
["inversa","Función inversa","Si f es biunívoca con dominio A y rango B, f⁻¹ tiene dominio B y rango A, con f⁻¹(y) = x ⇔ f(x) = y. Pasos: escribir y = f(x), despejar x, intercambiar x y y.","f(x) = x³ + 2 → f⁻¹(x) = ∛(x − 2). f(x) = (1 + 3x)/(5 − 2x) → f⁻¹(x) = (5x − 1)/(3 + 2x)."],
["parametricas","Curvas paramétricas","Curvas descritas con x = f(t) y y = g(t), útiles cuando no cumplen la prueba de la recta vertical.","x = cos t, y = sen t describe la circunferencia de radio 1."],
["distancia","Gráfica, distancia y pendiente","La gráfica de f es la de y = f(x). Distancia: d = √((x₂ − x₁)² + (y₂ − y₁)²). Recta: y − y₁ = m(x − x₁).","P₁(4, −1), P₂(−6, 3): d = √116 ≈ 10.77; m = −2/5; y = −(2/5)x + 3/5."],
["lin-cuad","Función lineal, cuadrática y cúbica","Lineal: f(x) = mx + b (recta). Cuadrática: ax² + bx + c, a ≠ 0 (parábola con vértice; abre hacia arriba si a > 0). Cúbica: ax³ + bx² + cx + d, con 1 a 3 raíces reales.","f(x) = x² − 4x + 3: abre hacia arriba, vértice (2, −1), corta el eje y en 3."]]],
["Semana 3 · Funciones polinomiales","Clase_6",[
["polinomial","Función polinomial","f(x) = aₙxⁿ + … + a₁x + a₀; el mayor exponente n es el grado. Grado 0: recta horizontal; 1: recta; 2: parábola.","f(x) = 2x³ − x + 5 tiene grado 3."],
["operaciones","Operaciones con funciones","Suma, resta, producto y cociente se hacen valor a valor: (f ± g)(x) = f(x) ± g(x), (fg)(x) = f(x)g(x), (f/g)(x) = f(x)/g(x) con g(x) ≠ 0.","f = 3x − 2, g = x³: (f + g) = x³ + 3x − 2; (fg) = 3x⁴ − 2x³; (f/g) = (3x − 2)/x³."],
["compuesta","Función compuesta","(f∘g)(x) = f(g(x)): se evalúa primero la función de adentro y su resultado entra a la de afuera.","f = x² − 16, g = √x: (f∘g)(x) = x − 16 con dominio [0, ∞); (g∘f)(x) = √(x² − 16) con dominio (−∞, −4] ∪ [4, ∞)."],
["division","División de polinomios","Dados f(x) y p(x) ≠ 0 existen únicos q(x) y r(x) con f = p·q + r, donde el grado de r es menor que el de p (o r = 0).","(x⁵ + 2x³ − x − 8) ÷ (x² − 2x + 1): cociente x³ + 2x² + 5x + 8, residuo 10x − 16."],
["sintetica","Teorema del residuo y división sintética","Al dividir f(x) entre x − c, el residuo es f(c). La división sintética (regla de Ruffini) usa solo los coeficientes.","(2x⁴ + 5x³ − 2x − 8) ÷ (x + 3): coeficientes 2, −1, 3, −11; residuo 25 = f(−3)."],

["Semana 4 · Funciones racionales","Clase_8",[
["racional","Función racional y asíntotas","f(x) = g(x)/h(x) con g, h polinomios; el dominio excluye los ceros de h. Asíntota vertical x = a: f → ±∞ cerca de a. Asíntota horizontal y = c: f → c cuando x → ±∞.","f(x) = 1/(x − 2): dominio ℝ∖{2}, asíntota vertical x = 2, horizontal y = 0."],
["horizontal","Asíntota horizontal","Se comparan grados: numerador < denominador → y = 0; iguales → y = cociente de coeficientes principales; numerador > denominador → no hay.","(5x² + 1)/(3x² − 4): y = 5/3. (3x − 1)/(x² − x − 6): y = 0. (2x⁴ − 3x² + 5)/(x² + 1): ninguna."],
["variacion","Variación (proporcionalidad)","Relación entre cantidades que cambian. Variación directa: y = kx, con k constante de proporcionalidad.","q directamente proporcional a z, q = 12 cuando z = 5: k = 12/5. Si z = 7, q = 16.8."]]],
["Semana 5 · Funciones exponenciales","Clase_9",[
["exponencial","Función exponencial","f(x) = aˣ con a > 0, a ≠ 1. Dominio ℝ, rango (0, ∞), pasa por (0, 1), asíntota en el eje x. Crece si a > 1 y decrece si 0 < a < 1.","f(x) = 2ˣ crece; f(x) = (1/2)ˣ decrece; ambas pasan por (0, 1)."],
["ec-exp","Ecuaciones exponenciales y propiedades","Se igualan las bases y luego los exponentes. Propiedades: aⁿ·aᵐ = aⁿ⁺ᵐ, aⁿ/aᵐ = aⁿ⁻ᵐ, (aⁿ)ᵐ = aⁿᵐ, a⁰ = 1, a⁻ⁿ = 1/aⁿ.","27^(1−x) = 9^(x−2) → 3^(3−3x) = 3^(2x−4) → 3 − 3x = 2x − 4 → x = 7/5."],
["interes","Interés compuesto","A = P(1 + r/n)^(nt): P capital, r tasa anual, n periodos por año, t años.","Q1,000 al 9% capitalizado mensualmente por 5 años: A = 1000(1 + 0.09/12)⁶⁰ ≈ Q1,565.68."],
["natural","Exponencial natural y crecimiento","f(x) = eˣ con e ≈ 2.71828 (número de Euler); su inversa es ln x. Crecimiento continuo: q(t) = q₀·e^(rt).","100 bacterias que crecen 20% por hora: q(5) = 100·e¹ ≈ 272 bacterias."]]],
["Semana 6 · Funciones logarítmicas","Clase_10",[

["ec-log","Propiedades y ecuaciones logarítmicas","logₐ1 = 0, logₐa = 1, log(xy) = log x + log y, log(x/y) = log x − log y, log xⁿ = n·log x.","log₁₀x + log₁₀(x − 3) = 1 → x(x − 3) = 10 → x = 5 (x = −2 se descarta)."],
["cambio","Logaritmo común, natural y cambio de base","log x = log₁₀x, ln x = logₑx; logₐb = log b / log a. Para resolver aˣ = b se aplica logaritmo a ambos lados.","ln x = 4.7 → x = e⁴·⁷ ≈ 109.95. 3ˣ = 21 → x = log 21 / log 3 ≈ 2.77. log₂5 ≈ 2.32."]]],
["Semana 7 · Funciones trigonométricas","Clase_11",[
["angulos","Ángulos, grados y radianes","Agudo < 90°, recto 90°, obtuso entre 90° y 180°, llano 180°. Coterminales: mismo lado inicial y terminal. 1° = 60′, 1′ = 60″ y 180° = π rad.","3 rad = 3·(180°/π) ≈ 171°53′14.28″. 73.26° = 73°15′36″. Coterminales de 60°: 420°, −300°."],
["arco","Longitud de arco y área de sector","s = r·θ y A = ½r²θ, con θ en radianes.","Arco de 10 cm en círculo de radio 4 cm: θ = 2.5 rad ≈ 143.24°; A = ½·16·2.5 = 20 cm²."],
["trig","Funciones trigonométricas en el triángulo","Relacionan un ángulo con las razones entre los lados: sen θ = op/hip, cos θ = ad/hip, tan θ = op/ad.","A 25 pies de un asta, el ángulo es 30°: h = 25·tan 30° ≈ 14.43 pies."],
["identidades","Identidades trigonométricas","tan θ = sen θ/cos θ; sen²θ + cos²θ = 1; 1 + tan²θ = sec²θ; 1 + cot²θ = csc²θ. Complementarios: sen 30° = cos 60°.","tan θ + cot θ = (sen²θ + cos²θ)/(sen θ cos θ) = 1/(sen θ cos θ) = sec θ·csc θ."]]],

["graficas","Gráficas: amplitud, periodo y fase","Para y = a·sen(bx + c): amplitud |a|, periodo 2π/b, desfase −c/b; un ciclo cumple 0 ≤ bx + c ≤ 2π.","y = 3 sen(2x + π/2): amplitud 3, periodo π, desfase −π/4, ciclo en [−π/4, 3π/4]."]]],

"calculo": [
"El <b>cálculo</b> (del latín <i>calculus</i>, «piedra», porque se contaba con piedritas) es el resultado de calcular: realizar operaciones para obtener las consecuencias de datos conocidos. En matemáticas es un procedimiento mecánico o algoritmo aplicado a datos formalizados y simbolizados. Sus orígenes tienen unos 2,500 años: los griegos hallaban áreas con el <b>método de agotamiento</b> (dividir una figura en polígonos y sumar sus áreas) y Eudoxo lo usó para probar la fórmula del área del círculo. Esa idea de aproximar con pasos cada vez más finos es el límite, base del <b>cálculo integral</b> (el problema del área) y del cálculo diferencial. Precálculo reúne las herramientas previas: álgebra, funciones y trigonometría.",

"La <b>recta numérica</b> es un gráfico unidimensional: una línea recta con puntos marcados a igual distancia que representan los enteros; a la derecha del 0 están los positivos y a la izquierda los negativos. Los números se clasifican en conjuntos que se contienen unos a otros: <b>naturales ℕ</b> (1, 2, 3…, con primos y compuestos), <b>enteros ℤ</b> (naturales, cero y negativos), <b>racionales ℚ</b> (fracciones p/q con q ≠ 0, incluye decimales finitos y periódicos), <b>irracionales</b> (decimales infinitos no periódicos: √2, π, e), <b>reales ℝ</b> (racionales más irracionales) y <b>complejos ℂ</b> (a + bi, con números imaginarios puros). Se cumple ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ.",
"Clasifique cada número en el conjunto más pequeño al que pertenece (ℕ, ℤ, ℚ o irracional):<br>−12,  2.6,  √11,  18/6",
"−12: es un entero negativo → ℤ<br>2.6 = 13/5: es una fracción → ℚ<br>√11 = 3.3166…: no termina ni se repite → irracional (está en ℝ)<br>18/6 = 3: es natural → ℕ (y también está en ℤ, ℚ y ℝ)"
],
"polinomio": [
"Un <b>polinomio</b> (del latín <i>polynomium</i>, «muchos») es una expresión formada por un número finito de variables y constantes (coeficientes) que usa solo suma, resta, multiplicación y exponentes enteros positivos. Es una suma o resta de <b>monomios</b> (términos). Según el número de términos se llama monomio (4x³), binomio (3x + 5) o trinomio (x² + 2x + 1). El <b>grado</b> es el mayor exponente de la variable. No son polinomios las expresiones con variables en el denominador, exponentes negativos o fraccionarios, ni raíces de la variable.",
"Determine si la expresión es un polinomio; si lo es, dé su grado, coeficiente principal, término independiente y número de términos:<br>P(x) = 7x³ − 4x + 9",
"Los exponentes de x son 3, 1 y 0: todos enteros no negativos.<br>No hay variables en el denominador ni dentro de raíces.<br>Por lo tanto, sí es un polinomio.<br>Grado: 3 (el mayor exponente)<br>Coeficiente principal: 7<br>Término independiente: 9<br>Tiene 3 términos, por eso es un trinomio."
],
"ecuacion": [
"Una <b>ecuación</b> es una igualdad matemática entre dos expresiones algebraicas que contiene una o más <b>incógnitas</b> (valores desconocidos, generalmente letras). Funciona como una balanza: ambos lados deben valer lo mismo. Tiene un signo igual que separa el <b>primer miembro</b> (izquierda) del <b>segundo miembro</b> (derecha). La <b>solución</b> es el valor que, al sustituir la incógnita, vuelve cierta la igualdad. Para despejar se hace la misma operación en ambos miembros, sin romper el equilibrio.",
"Resuelva la ecuación y compruebe la solución:<br>5(x + 3) − 2x = 4x − 9",
"Distribuir el 5: 5x + 15 − 2x = 4x − 9 → 3x + 15 = 4x − 9<br>Pasar las x a un lado y los números al otro: 15 + 9 = 4x − 3x → 24 = x<br>Solución: x = 24<br>Comprobación: 5(24 + 3) − 2(24) = 135 − 48 = 87 y 4(24) − 9 = 96 − 9 = 87.<br>Se cumple la igualdad."
],
"factorizacion": [
"La <b>factorización</b> descompone una expresión algebraica (número, suma o resta, polinomio, matriz) en forma de producto. Casos vistos: <b>1)</b> factor común; <b>2)</b> factor común por agrupación; <b>3)</b> trinomio cuadrado perfecto a² ± 2ab + b² = (a ± b)²; <b>4)</b> diferencia de cuadrados a² − b² = (a − b)(a + b); <b>5)</b> trinomio simple x² + bx + c; <b>6)</b> trinomio compuesto ax² + bx + c; <b>7)</b> trinomio cuadrado perfecto por adición y sustracción (se suma y resta el término que falta); <b>8)</b> cubo perfecto de binomio (a ± b)³; <b>9)</b> suma o diferencia de cubos a³ ± b³ = (a ± b)(a² ∓ ab + b²); <b>10)</b> suma o diferencia de potencias iguales.",
"Factorice completamente:<br>4a⁴ − 21a²b² + 25b⁴",
"Raíces de los extremos: √(4a⁴) = 2a² y √(25b⁴) = 5b²<br>Término central de un trinomio cuadrado perfecto: 2·(2a²)·(5b²) = 20a²b²<br>El término central es 21a²b², así que sobra a²b².<br>Se suma y se resta a²b² para completar el cuadrado: (4a⁴ − 20a²b² + 25b⁴) − a²b² = (2a² − 5b²)² − a²b²<br>Es una diferencia de cuadrados: (2a² − 5b²)² − (ab)² = (2a² − 5b² − ab)(2a² − 5b² + ab)<br>Resultado: (2a² − ab − 5b²)(2a² + ab − 5b²)"
],
"funcion": [
"Una <b>función</b> f es una relación entre un conjunto X (<b>dominio</b>) y un conjunto Y (<b>codominio</b>) donde a cada elemento x del dominio le corresponde un único elemento f(x). El <b>rango</b> es el conjunto de todos los valores posibles de f(x). La letra que representa un número del dominio es la <b>variable independiente</b> y la que representa un valor del rango es la <b>variable dependiente</b>. Se puede representar con un diagrama de flechas, una tabla, una fórmula o una gráfica. Para hallar el dominio se excluyen los valores que dividen entre cero o dan raíz par de un negativo.",
"Halle el dominio de la función:<br>f(x) = √(x − 3)/(x − 5)",
"Condición de la raíz cuadrada: x − 3 ≥ 0 → x ≥ 3<br>Condición del denominador: x − 5 ≠ 0 → x ≠ 5<br>Deben cumplirse las dos condiciones a la vez.<br>Dominio: [3, 5) ∪ (5, ∞)"
],
"biunivoca": [
"Una función f es <b>biunívoca</b> (uno a uno) si nunca toma el mismo valor dos veces: x₁ ≠ x₂ implica f(x₁) ≠ f(x₂). Gráficamente, ninguna recta horizontal corta la gráfica más de una vez (prueba de la recta horizontal). Es la condición necesaria para que exista la función inversa. Toda función creciente en todo su dominio, o decreciente en todo su dominio, es biunívoca.",
"Demuestre que f es biunívoca:<br>f(x) = (2x + 1)/(x − 3)",
"Suponer que f(a) = f(b): (2a + 1)/(a − 3) = (2b + 1)/(b − 3)<br>Multiplicar en cruz: (2a + 1)(b − 3) = (2b + 1)(a − 3)<br>Desarrollar: 2ab − 6a + b − 3 = 2ab − 6b + a − 3<br>Simplificar: −6a + b = −6b + a → 7b = 7a → b = a<br>Como f(a) = f(b) obliga a que a = b, la función es biunívoca."
],
"simetria": [
"Una función es <b>par</b> si f(−x) = f(x) para todo x del dominio: su gráfica es simétrica respecto al eje y. Es <b>impar</b> si f(−x) = −f(x): su gráfica es simétrica respecto al origen. Si no cumple ninguna, no tiene esa simetría. Para decidir se calcula f(−x) y se compara con f(x) y con −f(x). Los polinomios con solo exponentes pares son pares; con solo impares, son impares.",
"Determine si la función es par, impar o ninguna de las dos:<br>f(x) = 3x/(x² + 1)",
"Calcular f(−x): f(−x) = 3(−x)/((−x)² + 1)<br>Simplificar: f(−x) = −3x/(x² + 1)<br>Comparar: −3x/(x² + 1) = −[3x/(x² + 1)] = −f(x)<br>Como f(−x) = −f(x), la función es impar (simétrica respecto al origen)."
],
"inversa": [
"Si f es biunívoca con dominio A y rango B, su <b>función inversa</b> f⁻¹ tiene dominio B y rango A, y deshace el efecto de f: f⁻¹(y) = x ⇔ f(x) = y. Su gráfica es la reflexión de la de f respecto a la recta y = x. <b>Pasos:</b> (1) escribir y = f(x); (2) despejar x en términos de y; (3) intercambiar x y y; la ecuación resultante es y = f⁻¹(x). Atención: f⁻¹(x) no es 1/f(x).",
"Halle la función inversa de:<br>f(x) = (2x − 3)/(x + 4)",
"Paso 1: y = (2x − 3)/(x + 4)<br>Paso 2: y(x + 4) = 2x − 3 → xy + 4y = 2x − 3 → xy − 2x = −3 − 4y → x(y − 2) = −(4y + 3) → x = (4y + 3)/(2 − y)<br>Paso 3: intercambiar x y y → f⁻¹(x) = (4x + 3)/(2 − x)<br>Comprobación: f(1) = −1/5 y f⁻¹(−1/5) = (−4/5 + 3)/(2 + 1/5) = 1"
],
"parametricas": [
"Algunas curvas no se pueden escribir como y = f(x) porque no cumplen la prueba de la recta vertical. Se describen entonces con una <b>curva paramétrica</b>: un par de ecuaciones x = f(t) y y = g(t) donde el <b>parámetro</b> t (por ejemplo el tiempo) determina un punto (x, y) de la curva. Imagina una partícula que se mueve: en cada instante t está en una posición. Para ver la curva se puede eliminar el parámetro o tabular valores de t.",
"Elimine el parámetro y reconozca la curva:<br>x = t + 1,   y = t² − 2t",
"Despejar t de la primera ecuación: t = x − 1<br>Sustituir en la segunda: y = (x − 1)² − 2(x − 1)<br>Desarrollar: y = x² − 2x + 1 − 2x + 2 → y = x² − 4x + 3<br>Es una parábola que abre hacia arriba.<br>Puntos de comprobación: t = 0 → (1, 0); t = 1 → (2, −1); t = 2 → (3, 0)"
],
"distancia": [
"La <b>gráfica</b> de una función f es la gráfica de la ecuación y = f(x) para x en el dominio de f. En el plano de coordenadas, la <b>distancia</b> entre P₁(x₁, y₁) y P₂(x₂, y₂) es d = √((x₂ − x₁)² + (y₂ − y₁)²). La <b>pendiente</b> es m = (y₂ − y₁)/(x₂ − x₁) y la recta que pasa por un punto con pendiente m es y − y₁ = m(x − x₁).",
"Dados los puntos P₁(−2, 5) y P₂(4, −3), halle la distancia entre ellos, la pendiente de la recta que los une y la ecuación de esa recta.",
"Distancia: d = √((4 − (−2))² + (−3 − 5)²)<br>d = √(6² + (−8)²) = √(36 + 64) = √100 = 10<br>Pendiente: m = (−3 − 5)/(4 − (−2)) = −8/6 = −4/3<br>Ecuación punto-pendiente con P₁: y − 5 = −(4/3)(x + 2)<br>Despejar y: y = −(4/3)x − 8/3 + 5 → y = −(4/3)x + 7/3<br>Comprobación con P₂: −(4/3)(4) + 7/3 = −16/3 + 7/3 = −3 ✓"
],
"lin-cuad": [
"<b>Lineal:</b> f(x) = mx + b; su gráfica es una recta con pendiente m y corte b con el eje y. <b>Cuadrática:</b> f(x) = ax² + bx + c con a ≠ 0; su gráfica es una parábola con <i>vértice</i> (en x = −b/2a), <i>eje de simetría</i> vertical, concavidad hacia arriba si a > 0 y hacia abajo si a < 0, y corte con el eje y en c. <b>Cúbica:</b> f(x) = ax³ + bx² + cx + d con a ≠ 0; dominio y rango son todos los reales, tiene un punto de inflexión, forma de «S» acostada y entre 1 y 3 raíces reales.",
"Analice la parábola: halle su concavidad, vértice, eje de simetría y cortes con los ejes.<br>f(x) = −x² + 6x − 5",
"Concavidad: a = −1 &lt; 0 → abre hacia abajo<br>Vértice: x = −b/(2a) = −6/(2(−1)) = 3<br>f(3) = −9 + 18 − 5 = 4 → V(3, 4)<br>Eje de simetría: x = 3<br>Corte con el eje y: f(0) = −5 → (0, −5)<br>Cortes con el eje x: −x² + 6x − 5 = 0 → x² − 6x + 5 = 0 → (x − 1)(x − 5) = 0 → x = 1 y x = 5"
],
"polinomial": [
"Una <b>función polinomial</b> es una regla escrita como suma de términos con potencias enteras no negativas: f(x) = aₙxⁿ + … + a₁x + a₀, con aₙ ≠ 0. El mayor exponente n es el <b>grado</b>, aₙ es el <b>coeficiente principal</b> y a₀ es el <b>término independiente</b>, que es el corte con el eje y. Grado 0: recta horizontal; grado 1: recta con pendiente a₁; grado 2: parábola de eje vertical. El grado y el signo de aₙ determinan el comportamiento en los extremos de la gráfica.",
"Para la función polinomial dé el grado, el coeficiente principal, el corte con el eje y y el comportamiento en los extremos:<br>f(x) = −x³ + 2x² − 5",
"Grado: 3 (el mayor exponente)<br>Coeficiente principal: −1<br>Término independiente: −5 → corta el eje y en (0, −5)<br>Grado impar y coeficiente negativo: la gráfica sube a la izquierda y baja a la derecha.<br>Es decir, f(x) tiende a +∞ cuando x tiende a −∞, y a −∞ cuando x tiende a +∞."
],
"operaciones": [
"Con dos funciones f y g se forman nuevas funciones operando valor a valor: <b>suma</b> (f + g)(x) = f(x) + g(x); <b>diferencia</b> (f − g)(x) = f(x) − g(x); <b>producto</b> (fg)(x) = f(x)·g(x); <b>cociente</b> (f/g)(x) = f(x)/g(x), con g(x) ≠ 0. El dominio de la nueva función es la intersección de los dominios de f y g (y en el cociente se excluyen los ceros de g).",
"Halle f + g, f − g, f·g y f/g si:<br>f(x) = 2x + 1   y   g(x) = x² − 3",
"(f + g)(x) = 2x + 1 + x² − 3 = x² + 2x − 2<br>(f − g)(x) = 2x + 1 − (x² − 3) = −x² + 2x + 4<br>(f·g)(x) = (2x + 1)(x² − 3) = 2x³ − 6x + x² − 3 = 2x³ + x² − 6x − 3<br>(f/g)(x) = (2x + 1)/(x² − 3), con x ≠ ±√3"
],
"compuesta": [
"La <b>función compuesta</b> aplica dos funciones una tras otra: (f∘g)(x) = f(g(x)). Primero se evalúa x en la función de adentro g y el resultado entra a la de afuera f. En general f∘g ≠ g∘f. Su dominio son los x del dominio de g tales que g(x) está en el dominio de f.",
"Halle (f∘g)(x) y (g∘f)(x) con sus dominios si:<br>f(x) = 1/(x − 2)   y   g(x) = √x",
"(f∘g)(x) = f(√x) = 1/(√x − 2)<br>Dominio de f∘g: x ≥ 0 (por la raíz) y √x − 2 ≠ 0 → x ≠ 4<br>Dominio: [0, 4) ∪ (4, ∞)<br>(g∘f)(x) = g(1/(x − 2)) = √(1/(x − 2))<br>Dominio de g∘f: 1/(x − 2) ≥ 0 → x − 2 &gt; 0 → x &gt; 2<br>Dominio: (2, ∞)"
],
"division": [
"El <b>algoritmo de la división</b> dice que, dados f(x) (dividendo) y p(x) ≠ 0 (divisor), existen únicos q(x) (cociente) y r(x) (residuo) tales que f(x) = p(x)·q(x) + r(x), donde el grado de r es menor que el de p o r = 0 (división exacta). Se procede como en la división larga numérica: se ordena y completa con ceros, se divide el primer término, se multiplica, se resta y se repite.",
"Divida usando división larga:<br>(2x⁴ − x³ + 3x − 5) ÷ (x² + x − 1)",
"Completar el dividendo: 2x⁴ − x³ + 0x² + 3x − 5<br>2x⁴ ÷ x² = 2x² → restar 2x²(x² + x − 1) = 2x⁴ + 2x³ − 2x² → queda −3x³ + 2x² + 3x − 5<br>−3x³ ÷ x² = −3x → restar −3x(x² + x − 1) = −3x³ − 3x² + 3x → queda 5x² + 0x − 5<br>5x² ÷ x² = 5 → restar 5(x² + x − 1) = 5x² + 5x − 5 → queda −5x<br>Cociente: 2x² − 3x + 5<br>Residuo: −5x<br>Comprobación: (x² + x − 1)(2x² − 3x + 5) − 5x = 2x⁴ − x³ + 3x − 5"
],
"sintetica": [
"<b>Teorema del residuo:</b> al dividir un polinomio f(x) entre x − c, el residuo es f(c). La <b>división sintética</b> (regla de Ruffini) es un método abreviado para dividir entre x − c que trabaja solo con coeficientes: se escribe c a un lado, se baja el primer coeficiente, se multiplica por c, se suma a la siguiente columna y se repite. El último número es el residuo y los anteriores son los coeficientes del cociente (un grado menos). Faltantes se escriben como 0.",
"Divida usando división sintética y compruebe con el teorema del residuo:<br>(x⁴ − 5x² + 2x − 7) ÷ (x − 3)",
"Coeficientes (con ceros): 1, 0, −5, 2, −7 y c = 3<br>Se baja el primer coeficiente: 1<br>1·3 = 3 → 0 + 3 = 3<br>3·3 = 9 → −5 + 9 = 4<br>4·3 = 12 → 2 + 12 = 14<br>14·3 = 42 → −7 + 42 = 35<br>Cociente: x³ + 3x² + 4x + 14<br>Residuo: 35<br>Teorema del residuo: f(3) = 81 − 45 + 6 − 7 = 35 ✓"
],
"ceros": [
"Los <b>ceros</b> de un polinomio son los valores de x con P(x) = 0. Gráficamente son los cortes de la gráfica con el eje horizontal. Un polinomio de grado n > 0 tiene a lo sumo n ceros complejos distintos. Si P(c) = 0, entonces x − c es un factor de P (teorema del factor), así que con división sintética se baja el grado y se factoriza el cociente. Los ceros enteros candidatos son divisores del término independiente.",
"Halle todos los ceros del polinomio:<br>f(x) = x³ − 2x² − 5x + 6",
"Candidatos (divisores de 6): ±1, ±2, ±3, ±6<br>Probar x = 1: f(1) = 1 − 2 − 5 + 6 = 0 → x = 1 es un cero<br>División sintética con c = 1: 1, −2, −5, 6 → 1, −1, −6 y residuo 0<br>Cociente: x² − x − 6<br>Factorizar: x² − x − 6 = (x − 3)(x + 2) → x = 3 y x = −2<br>Ceros: x = −2, x = 1 y x = 3"
],
"racional": [
"Una <b>función racional</b> es un cociente de polinomios, f(x) = g(x)/h(x). Su dominio son todos los reales excepto los ceros del denominador h(x). La recta x = a es una <b>asíntota vertical</b> si f(x) → ∞ o −∞ cuando x se acerca a a por la izquierda o la derecha (ocurre en los ceros del denominador que no se cancelan). La recta y = c es una <b>asíntota horizontal</b> si f(x) → c cuando x → ∞ o x → −∞. La gráfica se acerca a las asíntotas sin tocarlas en esos extremos.",
"Halle el dominio, las asíntotas y los cortes con los ejes, y bosqueje la gráfica con una tabla de valores:<br>f(x) = (x + 1)/(x − 3)",
"Dominio: x − 3 ≠ 0 → x ≠ 3, es decir ℝ∖{3}<br>Asíntota vertical: x = 3 (el denominador es 0 y el numerador no)<br>Asíntota horizontal: grados iguales → y = 1/1 = 1<br>Corte con el eje x: x + 1 = 0 → x = −1<br>Corte con el eje y: f(0) = 1/(−3) = −1/3<br>Tabla: f(−1) = 0, f(2) = −3, f(2.5) = −7, f(3.5) = 9, f(4) = 5, f(5) = 3<br>La rama izquierda baja hacia −∞ junto a x = 3 y la derecha desciende desde +∞, y ambas se acercan a y = 1."
],
"horizontal": [
"Para hallar la asíntota horizontal de f(x) = g(x)/h(x) se comparan los grados del numerador (n) y del denominador (m): si n &lt; m, la asíntota es y = 0; si n = m, es y = (coeficiente principal de g)/(coeficiente principal de h); si n &gt; m, no hay asíntota horizontal. El método de fondo es dividir numerador y denominador entre la mayor potencia de x del denominador y ver a qué tiende la expresión cuando x → ±∞.",
"Halle la asíntota horizontal de:<br>f(x) = (4x³ − x)/(2x³ + 5)",
"Los grados del numerador y del denominador son iguales (3 y 3).<br>Dividir numerador y denominador entre x³: f(x) = (4 − 1/x²)/(2 + 5/x³)<br>Cuando x tiende a ±∞, los términos 1/x² y 5/x³ tienden a 0.<br>Entonces f(x) se acerca a 4/2 = 2.<br>Asíntota horizontal: y = 2"
],
"variacion": [
"La <b>variación</b> (o proporción) describe cómo cambian cantidades relacionadas. <b>Variación directa:</b> y = kx, donde k es la <b>constante de proporcionalidad</b>; si x aumenta, y aumenta en la misma razón. <b>Variación inversa:</b> y = k/x. También puede ser con una potencia (y = kx²) o combinada (conjunta). Para resolver: escribir la fórmula con k, usar el dato dado para hallar k y luego sustituir.",
"La presión P de un gas es inversamente proporcional a su volumen V. Si P = 50 cuando V = 12, halle la fórmula de P y el valor de P cuando V = 30.",
"Variación inversa: P = k/V<br>Hallar k con los datos: 50 = k/12 → k = 50·12 = 600<br>Fórmula: P = 600/V<br>Para V = 30: P = 600/30 = 20"
],
"exponencial": [
"Una <b>función exponencial</b> tiene la forma f(x) = aˣ, con base a &gt; 0 y a ≠ 1; la variable está en el exponente. Propiedades: dominio todos los reales; rango (0, ∞); siempre pasa por (0, 1); el eje x es asíntota horizontal. Si a &gt; 1 es creciente (crecimiento); si 0 &lt; a &lt; 1 es decreciente (decaimiento). Caso especial: la base e ≈ 2.718 (número de Euler).",
"Grafique con una tabla de valores y dé el dominio, el rango y la asíntota de:<br>f(x) = (1/3)ˣ",
"Base: a = 1/3, con 0 &lt; a &lt; 1 → función decreciente<br>Tabla: x = −2, −1, 0, 1, 2 → f(x) = 9, 3, 1, 1/3, 1/9<br>La curva pasa por (0, 1), baja hacia la derecha y se pega al eje x.<br>Dominio: ℝ = (−∞, ∞)<br>Rango: (0, ∞)<br>Asíntota horizontal: y = 0"
],
"ec-exp": [
"Una <b>ecuación exponencial</b> tiene la incógnita en el exponente. Si se pueden escribir ambos lados con la misma base, se igualan los exponentes. Propiedades: aⁿ·aᵐ = aⁿ⁺ᵐ; aⁿ/aᵐ = aⁿ⁻ᵐ; (aⁿ)ᵐ = aⁿᵐ; a⁰ = 1; a¹ = a; a⁻ⁿ = 1/aⁿ; (ab)ⁿ = aⁿbⁿ; (a/b)⁻ⁿ = (b/a)ⁿ. Si las bases no se pueden igualar, se usan logaritmos.",
"Resuelva la ecuación exponencial:<br>4^(2x − 1) = 8^(x + 2)",
"Escribir las bases como potencias de 2: 4 = 2² y 8 = 2³<br>(2²)^(2x − 1) = (2³)^(x + 2)<br>Multiplicar los exponentes: 2^(4x − 2) = 2^(3x + 6)<br>Igualar los exponentes: 4x − 2 = 3x + 6 → x = 8<br>Comprobación: 4¹⁵ = 2³⁰ y 8¹⁰ = 2³⁰ ✓"
],
"interes": [
"El <b>interés compuesto</b> hace que los intereses ganados también generen intereses. La fórmula es A = P(1 + r/n)^(nt), donde A es la cantidad después de t años, P el capital inicial, r la tasa anual en decimal, n el número de periodos de capitalización por año y t los años de inversión. Es una función exponencial del tiempo: cuanto más largo el plazo, más rápido crece.",
"Se invierten Q2,500 al 6% anual capitalizado trimestralmente. ¿Cuánto dinero habrá después de 8 años?",
"Fórmula: A = P(1 + r/n)^(nt)<br>Datos: P = 2500, r = 0.06, n = 4, t = 8<br>Sustituir: A = 2500(1 + 0.06/4)^(4·8) = 2500(1.015)³²<br>1.015³² ≈ 1.61032<br>A ≈ 2500·1.61032 ≈ Q4,025.81<br>Respuesta: después de 8 años habrá aproximadamente Q4,025.81."
],
"natural": [
"La <b>función exponencial natural</b> es f(x) = eˣ, con e ≈ 2.71828 (número de Euler, matemático suizo del siglo XVIII). Es la única función igual a su propia derivada; su dominio y rango son (−∞, ∞) y (0, ∞), pasa por (0, 1), es creciente y su inversa es ln x. Modela el crecimiento o decaimiento continuo: q(t) = q₀·e^(rt), con q₀ cantidad inicial, r la tasa (positiva si crece, negativa si decrece) y t el tiempo.",
"Un cultivo tiene 500 bacterias y crece continuamente a una tasa de 8% por hora. ¿Cuántas bacterias habrá después de 12 horas?",
"Fórmula de crecimiento continuo: q(t) = q₀·e^(rt)<br>Datos: q₀ = 500, r = 0.08, t = 12<br>Sustituir: q(12) = 500·e^(0.08·12) = 500·e^0.96<br>e^0.96 ≈ 2.6117<br>q(12) ≈ 500·2.6117 ≈ 1,306<br>Respuesta: habrá aproximadamente 1,306 bacterias."
],
"logaritmica": [
"La <b>función logarítmica</b> f(x) = logₐ(x), con a &gt; 0 y a ≠ 1, es la inversa de la exponencial de base a: y = logₐ x ⇔ aʸ = x. Se lee «logaritmo de x en base a». Dominio (0, ∞); rango (−∞, ∞); asíntota vertical x = 0; pasa por (1, 0). Es creciente si a &gt; 1 y decreciente si 0 &lt; a &lt; 1. No existen logaritmos de números negativos ni de cero.",
"Evalúe cada logaritmo y explique por qué el último no existe:<br>log₂ 64,   log₃(1/27),   log₁₆ 4,   log₅(−5)",
"log₂ 64: 2ˣ = 64 → 2⁶ = 64 → x = 6<br>log₃(1/27): 3ˣ = 1/27 → 3⁻³ = 1/27 → x = −3<br>log₁₆ 4: 16ˣ = 4 → 16^(1/2) = 4 → x = 1/2<br>log₅(−5): 5ˣ = −5 no tiene solución, porque 5ˣ siempre es positivo, así que no existe."
],
"ec-log": [
"Una <b>ecuación logarítmica</b> tiene la incógnita dentro de un logaritmo. Propiedades: logₐ1 = 0; logₐa = 1; logₐ(xy) = logₐx + logₐy; logₐ(x/y) = logₐx − logₐy; logₐxⁿ = n·logₐx; logₐ(ⁿ√x) = (1/n)logₐx. Método: combinar logaritmos, pasar a forma exponencial, resolver y <b>comprobar</b> que cada argumento original sea positivo, pues las raíces que lo violan se descartan.",
"Resuelva y compruebe las soluciones:<br>log₂ x + log₂(x − 2) = 3",
"Combinar los logaritmos: log₂[x(x − 2)] = 3<br>Pasar a forma exponencial: x(x − 2) = 2³ = 8<br>Resolver: x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0 → x = 4 o x = −2<br>Comprobar: x = −2 hace negativo log₂ x, así que se descarta.<br>Con x = 4: log₂ 4 + log₂ 2 = 2 + 1 = 3 ✓<br>Solución: x = 4"
],
"cambio": [
"El <b>logaritmo común</b> es log x = log₁₀x y el <b>natural</b> es ln x = logₑx. Formas equivalentes: log x = 2 ⇔ 10² = x; ln x = 2 ⇔ e² = x. <b>Cambio de base:</b> logₐb = log b / log a = ln b / ln a (no es log b − log a ni log(b/a)). Para ecuaciones exponenciales con bases distintas se aplica logaritmo a ambos lados: los exponentes bajan como multiplicadores.",
"Resuelva usando logaritmos y dé el resultado con 3 decimales:<br>4^(x + 1) = 50",
"Aplicar logaritmo natural a ambos lados: ln 4^(x + 1) = ln 50<br>Bajar el exponente: (x + 1)·ln 4 = ln 50<br>Despejar: x + 1 = ln 50/ln 4<br>Calcular: ln 50 ≈ 3.9120 y ln 4 ≈ 1.3863 → x + 1 ≈ 2.8219<br>Resultado: x ≈ 2.8219 − 1 ≈ 1.822"
],
"angulos": [
"Un <b>ángulo</b> es la porción de plano entre dos semirrectas con el mismo origen. Tipos: agudo (&lt; 90°), recto (90°), obtuso (entre 90° y 180°), llano (180°), completo (360°). Dos ángulos son <b>coterminales</b> si, en posición estándar, comparten lado inicial y terminal: difieren en múltiplos de 360° (2π rad). Complementarios suman 90°; suplementarios, 180°. Un grado se divide en 60 minutos (′) y un minuto en 60 segundos (″). Un <b>radián</b> es el ángulo central que abarca un arco igual al radio: 180° = π rad.",
"Convierta 2.4 radianes a grados, minutos y segundos.",
"Fórmula: grados = radianes·(180°/π)<br>2.4·(180°/π) ≈ 137.50987°<br>Parte decimal a minutos: 0.50987·60 ≈ 30.592′ → 30′<br>Parte decimal a segundos: 0.592·60 ≈ 35.5″<br>Resultado: 2.4 rad ≈ 137°30′35.5″"
],
"arco": [
"Si un arco de longitud s en un círculo de radio r subtiende un ángulo central de θ <b>radianes</b>, la <b>longitud de arco</b> es s = r·θ. El <b>área del sector circular</b> determinado por θ es A = ½·r²·θ. Ambas fórmulas exigen θ en radianes; si viene en grados se convierte multiplicando por π/180°.",
"En un círculo de radio 6 cm, un ángulo central mide 40°. Halle la longitud del arco y el área del sector circular.",
"Pasar a radianes: θ = 40°·(π/180°) = 2π/9 ≈ 0.6981 rad<br>Longitud de arco: s = r·θ = 6·(2π/9) = 4π/3 ≈ 4.19 cm<br>Área del sector: A = ½·r²·θ = ½·36·(2π/9) = 4π ≈ 12.57 cm²"
],
"trig": [
"Las <b>funciones trigonométricas</b> relacionan un ángulo agudo de un triángulo rectángulo con las razones entre sus lados: sen θ = cateto opuesto/hipotenusa; cos θ = cateto adyacente/hipotenusa; tan θ = opuesto/adyacente; y sus recíprocas csc θ = 1/sen θ, sec θ = 1/cos θ, cot θ = 1/tan θ. Se usan para calcular alturas y distancias inaccesibles a partir de un ángulo y un lado conocido.",
"Desde un punto a 40 m de la base de un edificio, el ángulo de elevación hasta su azotea es de 55°. ¿Cuál es la altura del edificio?",
"Triángulo rectángulo: cateto adyacente = 40 m y ángulo = 55°<br>La altura es el cateto opuesto: tan 55° = h/40<br>Despejar h: h = 40·tan 55°<br>tan 55° ≈ 1.4281 → h ≈ 40·1.4281 ≈ 57.13 m<br>Respuesta: el edificio mide aproximadamente 57.13 m."
],
"identidades": [
"Una <b>identidad trigonométrica</b> es una igualdad cierta para todos los valores donde está definida. Básicas: de cociente tan θ = sen θ/cos θ y cot θ = cos θ/sen θ; recíprocas; de Pitágoras sen²θ + cos²θ = 1, 1 + tan²θ = sec²θ, 1 + cot²θ = csc²θ; de cofunción sen 30° = cos 60°, tan 40° = cot 50°. Para <b>demostrar</b> una identidad se trabaja un lado (normalmente el más complicado) hasta llegar al otro, escribiendo todo en seno y coseno.",
"Demuestre la identidad:<br>sen θ/(1 + cos θ) + (1 + cos θ)/sen θ = 2 csc θ",
"Denominador común: [sen²θ + (1 + cos θ)²]/[sen θ(1 + cos θ)]<br>Desarrollar el cuadrado: (sen²θ + 1 + 2cos θ + cos²θ)/[sen θ(1 + cos θ)]<br>Usar sen²θ + cos²θ = 1: (2 + 2cos θ)/[sen θ(1 + cos θ)]<br>Factorizar el numerador: 2(1 + cos θ)/[sen θ(1 + cos θ)]<br>Cancelar (1 + cos θ): 2/sen θ = 2 csc θ ∎"
],
"negativos": [
"Los ángulos negativos se miden en sentido horario. Sus funciones se relacionan con las de los ángulos positivos: sen(−θ) = −sen θ, csc(−θ) = −csc θ, tan(−θ) = −tan θ, cot(−θ) = −cot θ, cos(−θ) = cos θ, sec(−θ) = sec θ. <b>Teorema:</b> coseno y secante son funciones <b>pares</b>; seno, cosecante, tangente y cotangente son <b>impares</b>. Estas reglas sirven para simplificar expresiones y verificar identidades.",
"Verifique la identidad usando ángulos negativos:<br>cot(−x)·sen(−x) = cos x",
"Aplicar paridad: cot(−x) = −cot x y sen(−x) = −sen x<br>Sustituir: (−cot x)(−sen x) = cot x·sen x<br>Escribir cot x = cos x/sen x: (cos x/sen x)·sen x<br>Cancelar sen x: cos x ∎"
],
"referencia": [
"Sea θ un ángulo no cuadrantal en posición estándar. Su <b>ángulo de referencia</b> θ_R es el ángulo agudo que el lado terminal de θ forma con el eje x. Sirve para evaluar funciones de cualquier ángulo: f(θ) = ± f(θ_R), donde el signo depende del cuadrante. Cálculo según el cuadrante (θ entre 0° y 360°): I: θ_R = θ; II: 180° − θ; III: θ − 180°; IV: 360° − θ. Si θ es negativo o mayor que 360°, primero se busca un ángulo coterminal.",
"Halle el ángulo de referencia de θ = −500° y úselo para calcular sen(−500°).",
"Buscar un ángulo coterminal entre 0° y 360°: −500° + 720° = 220°<br>220° está en el cuadrante III (entre 180° y 270°).<br>Ángulo de referencia: θ_R = 220° − 180° = 40°<br>En el cuadrante III el seno es negativo.<br>sen(−500°) = −sen 40° ≈ −0.6428"
],
"graficas": [
"Las gráficas de seno y coseno son ondas periódicas que oscilan entre −1 y 1. Para y = a·sen(bx + c) (o con coseno): la <b>amplitud</b> es |a| (altura máxima desde el eje); el <b>periodo</b> es 2π/|b| (distancia horizontal de un ciclo completo); el <b>desplazamiento de fase</b> es −c/b (corrimiento horizontal); un ciclo se halla resolviendo 0 ≤ bx + c ≤ 2π. Si a es negativo la gráfica se refleja respecto al eje x, y sumar una constante la desplaza verticalmente.",
"Halle la amplitud, el periodo, el desplazamiento de fase y el intervalo de un ciclo de:<br>y = −2 sen(3x − π)",
"Comparar con y = a·sen(bx + c): a = −2, b = 3 y c = −π<br>Amplitud: |a| = 2<br>Periodo: 2π/b = 2π/3<br>Desplazamiento de fase: −c/b = π/3 (hacia la derecha)<br>Un ciclo: 0 ≤ 3x − π ≤ 2π → π ≤ 3x ≤ 3π → π/3 ≤ x ≤ π<br>Como a es negativo, la gráfica se refleja respecto al eje x."
],
"suma-resta": [
"Las <b>fórmulas de suma y resta</b> permiten hallar valores exactos de ángulos que se escriben como suma o diferencia de ángulos conocidos (30°, 45°, 60°…): cos(α + β) = cos α cos β − sen α sen β; cos(α − β) = cos α cos β + sen α sen β; sen(α + β) = sen α cos β + cos α sen β; sen(α − β) = sen α cos β − cos α sen β; tan(α ± β) = (tan α ± tan β)/(1 ∓ tan α tan β). Las de cofunción relacionan sen y cos de ángulos complementarios.",
"Halle el valor exacto de sen 75° usando una fórmula de suma.",
"Escribir 75° = 45° + 30°<br>sen(45° + 30°) = sen 45°·cos 30° + cos 45°·sen 30°<br>Valores conocidos: sen 45° = cos 45° = √2/2, cos 30° = √3/2 y sen 30° = 1/2<br>Sustituir: (√2/2)(√3/2) + (√2/2)(1/2) = √6/4 + √2/4<br>Resultado: sen 75° = (√6 + √2)/4 ≈ 0.9659"
],
"multiples": [
"<b>Ángulo doble:</b> sen 2θ = 2 sen θ cos θ; cos 2θ = cos²θ − sen²θ = 1 − 2sen²θ = 2cos²θ − 1; tan 2θ = 2tan θ/(1 − tan²θ). <b>Reducción de potencias</b> (semiángulo): sen²θ = (1 − cos 2θ)/2; cos²θ = (1 + cos 2θ)/2; tan²θ = (1 − cos 2θ)/(1 + cos 2θ). <b>Semiángulo:</b> sen(θ/2) = ±√((1 − cos θ)/2); cos(θ/2) = ±√((1 + cos θ)/2); tan(θ/2) = (1 − cos θ)/sen θ; el signo lo da el cuadrante de θ/2.",
"Si cos θ = −5/13 y θ está en el cuadrante II, halle sen 2θ, cos 2θ y tan 2θ.",
"Hallar sen θ: sen²θ = 1 − cos²θ = 1 − 25/169 = 144/169<br>En el cuadrante II el seno es positivo: sen θ = 12/13<br>Ángulo doble del seno: sen 2θ = 2 sen θ cos θ = 2(12/13)(−5/13) = −120/169<br>Ángulo doble del coseno: cos 2θ = cos²θ − sen²θ = 25/169 − 144/169 = −119/169<br>Tangente: tan 2θ = sen 2θ/cos 2θ = (−120/169)/(−119/169) = 120/119"
],
"prod-suma": [
"Las <b>fórmulas de producto a suma</b> convierten productos de senos y cosenos en sumas (útiles después en integración): sen α cos β = ½[sen(α+β) + sen(α−β)]; cos α sen β = ½[sen(α+β) − sen(α−β)]; cos α cos β = ½[cos(α+β) + cos(α−β)]; sen α sen β = ½[cos(α−β) − cos(α+β)]. Las de <b>suma a producto</b> hacen lo inverso: sen α + sen β = 2 sen((α+β)/2) cos((α−β)/2); sen α − sen β = 2 cos((α+β)/2) sen((α−β)/2); cos α + cos β = 2 cos((α+β)/2) cos((α−β)/2); cos α − cos β = −2 sen((α+β)/2) sen((α−β)/2).",
"Verifique la identidad usando fórmulas de suma a producto:<br>(sen 5x + sen 3x)/(cos 5x + cos 3x) = tan 4x",
"Numerador: sen 5x + sen 3x = 2 sen((5x + 3x)/2)·cos((5x − 3x)/2) = 2 sen 4x·cos x<br>Denominador: cos 5x + cos 3x = 2 cos((5x + 3x)/2)·cos((5x − 3x)/2) = 2 cos 4x·cos x<br>Cociente: (2 sen 4x·cos x)/(2 cos 4x·cos x)<br>Cancelar 2 cos x: sen 4x/cos 4x = tan 4x ∎"
],
"senos": [
"La <b>ley de senos</b> relaciona los lados de un triángulo oblicuángulo (sin ángulo recto) con los senos de sus ángulos opuestos: a/sen α = b/sen β = c/sen γ, con α + β + γ = 180°. Se usa cuando se conocen dos ángulos y un lado (ALA, AAL) o dos lados y un ángulo opuesto a uno de ellos (LLA). El caso LLA puede ser ambiguo: dar un triángulo, dos o ninguno (cuando el seno calculado sale mayor que 1).",
"Resuelva el triángulo si:<br>α = 35°,   β = 62°   y   a = 18",
"Ángulo faltante: γ = 180° − 35° − 62° = 83°<br>Ley de senos: a/sen α = b/sen β = c/sen γ<br>Lado b: b = a·sen β/sen α = 18·sen 62°/sen 35° ≈ 18·0.8829/0.5736 ≈ 27.71<br>Lado c: c = a·sen γ/sen α = 18·sen 83°/sen 35° ≈ 18·0.9925/0.5736 ≈ 31.15"
],
"cosenos": [
"La <b>ley de cosenos</b> generaliza el teorema de Pitágoras: el cuadrado de un lado es la suma de los cuadrados de los otros dos menos el doble producto de ellos por el coseno del ángulo entre ambos: a² = b² + c² − 2bc cos α; b² = a² + c² − 2ac cos β; c² = a² + b² − 2ab cos γ. Se usa cuando se conocen los tres lados (LLL) o dos lados y el ángulo entre ellos (LAL). Si el ángulo es 90°, se reduce a Pitágoras.",
"Resuelva el triángulo si:<br>a = 12,   b = 9   y   γ = 50° (ángulo entre a y b)",
"Lado desconocido: c² = a² + b² − 2ab·cos γ<br>c² = 12² + 9² − 2(12)(9)·cos 50° = 225 − 216(0.6428) ≈ 86.16<br>c = √86.16 ≈ 9.28<br>Ángulo α: cos α = (b² + c² − a²)/(2bc) = (81 + 86.16 − 144)/(2·9·9.28) ≈ 0.1386 → α ≈ 82.03°<br>Ángulo β: β = 180° − 50° − 82.03° ≈ 47.97°"
],
"area-tri": [
"Áreas de un triángulo: la básica A = (b·h)/2; con dos lados y el ángulo entre ellos, A = ½·a·b·sen γ; equilátero de lado b: A = (√3/4)·b²; y la <b>fórmula de Herón</b> (Herón de Alejandría) con los tres lados: A = √(s(s − a)(s − b)(s − c)), donde s = (a + b + c)/2 es el semiperímetro.",
"Halle el área de un triángulo cuyos lados miden 13 cm, 14 cm y 15 cm.",
"Fórmula de Herón: A = √(s(s − a)(s − b)(s − c)), con s = (a + b + c)/2<br>Semiperímetro: s = (13 + 14 + 15)/2 = 42/2 = 21<br>Sustituir: A = √(21·(21 − 13)·(21 − 14)·(21 − 15)) = √(21·8·7·6)<br>Calcular: A = √7056 = 84 cm²"
],
"vectores": [
"Un <b>vector</b> es un segmento de recta orientado con <b>magnitud</b> (longitud), <b>dirección</b> (ángulo con un eje) y <b>sentido</b> (punta de flecha), con un punto de aplicación. En componentes a = ⟨a₁, a₂⟩, su magnitud es |a| = √(a₁² + a₂²). Suma: ⟨a₁ + b₁, a₂ + b₂⟩. Producto por escalar: m·a = ⟨ma₁, ma₂⟩. Vectores unitarios: i = ⟨1, 0⟩ y j = ⟨0, 1⟩. Componentes: a₁ = |a|cos θ y a₂ = |a|sen θ. La suma es conmutativa y asociativa y distribuye con escalares.",
"Dados los vectores<br>a = ⟨3, −2⟩   y   b = ⟨−1, 4⟩<br>halle 3a + 2b, su magnitud y su dirección.",
"Multiplicar por escalares: 3a = ⟨9, −6⟩ y 2b = ⟨−2, 8⟩<br>Sumar componente a componente: 3a + 2b = ⟨9 − 2, −6 + 8⟩ = ⟨7, 2⟩<br>Magnitud: |3a + 2b| = √(7² + 2²) = √53 ≈ 7.28<br>Dirección: tan θ = 2/7 → θ = tan⁻¹(2/7) ≈ 15.95° (primer cuadrante)"
],
"punto": [
"El <b>producto punto</b> (escalar o interno) de dos vectores da un número real: a·b = a₁b₁ + a₂b₂ = |a||b|cos θ, donde θ es el ángulo entre ellos. Propiedades: a·a = |a|²; a·b = b·a; a·(b + c) = a·b + a·c; (ma)·b = m(a·b); 0·a = 0. Si los vectores son paralelos, θ = 0 o π; si son ortogonales (perpendiculares), θ = π/2 y a·b = 0. El ángulo se halla con θ = cos⁻¹(a·b/(|a||b|)). Aplicaciones: proyección de un vector sobre otro y trabajo.",
"Halle el producto punto y el ángulo entre los vectores<br>a = ⟨3, 1⟩   y   b = ⟨−1, 2⟩",
"Producto punto: a·b = (3)(−1) + (1)(2) = −3 + 2 = −1<br>Magnitudes: |a| = √(9 + 1) = √10 y |b| = √(1 + 4) = √5<br>Fórmula del ángulo: cos θ = a·b/(|a||b|) = −1/(√10·√5) = −1/√50 ≈ −0.1414<br>θ = cos⁻¹(−0.1414) ≈ 98.13°<br>Como a·b ≠ 0, los vectores no son ortogonales (el ángulo es obtuso)."
],
"cruz": [
"El <b>producto cruz</b> (vectorial) es una operación entre dos vectores de un espacio tridimensional cuyo resultado es un <b>vector</b> perpendicular a ambos; su magnitud es |a||b|sen θ y es el área del paralelogramo que forman. Con a = ⟨a₁, a₂, a₃⟩ y b = ⟨b₁, b₂, b₃⟩: a × b = (a₂b₃ − a₃b₂)i − (a₁b₃ − a₃b₁)j + (a₁b₂ − a₂b₁)k, que es el determinante con filas i, j, k / a / b. No es conmutativo: a × b = −(b × a). Comparación: el producto punto da un escalar (cualquier dimensión, usa cos 90° para perpendiculares, mide trabajo); el cruz da un vector (3D, usa sen 90° para perpendiculares; aparece en la fuerza magnética).",
"Calcule a × b si<br>a = ⟨1, 3, −2⟩   y   b = ⟨4, −1, 2⟩",
"Componente i: (3)(2) − (−2)(−1) = 6 − 2 = 4<br>Componente j: −[(1)(2) − (−2)(4)] = −(2 + 8) = −10<br>Componente k: (1)(−1) − (3)(4) = −1 − 12 = −13<br>Resultado: a × b = 4i − 10j − 13k<br>Comprobación: a·(a × b) = 4 − 30 + 26 = 0 y b·(a × b) = 16 + 10 − 26 = 0, así que es perpendicular a ambos."
],
"complejos": [
"Los <b>números complejos</b> extienden los reales y permiten resolver ecuaciones sin solución real: z = a + bi, con a la <b>parte real</b>, bi la <b>parte imaginaria</b> e i la unidad imaginaria, i² = −1. Se grafican en el plano complejo (eje real horizontal, eje imaginario vertical). El <b>valor absoluto</b> o módulo es r = √(a² + b²) y el ángulo θ cumple tan θ = b/a (ojo con el cuadrante). Formas: <b>trigonométrica</b> z = r(cos θ + i sen θ) y <b>exponencial</b> z = r·e^(iθ), pues cos θ + i sen θ = e^(iθ).",
"Exprese en forma trigonométrica:<br>z = −3 + 4i",

var FN=['sen','cos','tan','log','ln','cot','sec','csc','lím','cm','kg','pies','si'];
function nw(t){return (t.match(/[A-Za-zÁ-úñ]{3,}/g)||[]).filter(function(w){return FN.indexOf(w.toLowerCase())<0}).length;}
function isM(t){var w=t.replace(/[A-Za-zÁ-úñ]{1,3}(?=[\s(⁰-⁹₀-₉²³]|$)/g,'').match(/[A-Za-zÁ-úñ]{4,}/g);return !w||w.length<1;}
function planteo(t){
 var L=t.split('<br>'),h='<div class="ex-b"><p class="tx">'+L[0]+'</p>';
 L.slice(1).forEach(function(q){h+='<div class="pt" style="justify-content:center"><span class="m" style="'+(nw(q)>=4?'font-family:inherit;font-size:1rem':'')+'">'+q+'</span></div>';});
 return h+'</div>';
}
function sentences(line){
 var out=[];line.split(/\s{2,}/).forEach(function(seg){seg.split(/(?:\.|(?<!&gt|&lt|&amp);)(?=\s+\S)/).forEach(function(x){x=x.trim();if(x)out.push(x.replace(/\.$/,''));});});
 return out;
}
function solu(t){
 var seen=false,stop=false,lines=t.split('<br>'),h='<div class="ex-b">',n=0,open=false,fin='';
 lines.forEach(function(L){
  if(stop)return;
  var g=L.match(/^\(([a-e])\)\s*(.*)$/);
  var rest=L;
  if(g){if(seen){stop=true;return;}seen=true;rest=g[2];}
  // varios incisos en una misma línea
  var multi=rest.split(/\s{2,}(?=\([a-e]\)\s)/);
  multi.forEach(function(mm,mi){
   var gg=mm.match(/^\(([a-e])\)\s*(.*)$/);
   if(gg){if(mi>0){stop=true;return;}mm=gg[2];}
   sentences(mm).forEach(function(x){
    var pre=[],m2;
    while((m2=x.match(/^([^=→:]{3,}?):\s+(.+)$/))&&nw(m2[1])>=0&&!/[=]/.test(m2[1])){pre.push(m2[1]);x=m2[2];}
    var segs=nw(x)>=5?[x]:x.split(/\s*→\s*/);
    n++;
    h+='<div class="st"><span class="n">'+n+'</span><div class="tx">';
    pre.forEach(function(q){h+='<div style="margin:2px 0 4px"><b>'+q+':</b></div>';});
    segs.forEach(function(q,qi){
     if(nw(q)>=2)h+='<div style="margin:4px 0">'+(qi>0?'<span style="color:var(--mu)">⇒ </span>':'')+q+(qi===segs.length-1&&!pre.length&&segs.length===1?'.':'')+'</div>';
     else h+='<div class="mt'+(qi>0?' arrow':'')+'">'+q+'</div>';
    });
    h+='</div></div>';
   });
  });
 });
 return h+'</div>';
}
